[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocord"
version = "0.0.1"
description = "A tool for exporting and preparing Discord chat data for LLM training"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "appdirs>=1.4.4",
    "typer>=0.27.0",
    "PyYAML>=6.0.3",
    "emoji>=2.0.0"
]

[project.scripts]
nanocord = "nanocord.cli:nanocord"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

# torch, unsloth, unsloth_zoo, xformers, bitsandbytes intentionally omitted -
# install manually via Unsloth's hardware-aware installer (unsloth.ai/get-started)
# BEFORE running `pip install -e .[train]`.
train = [
    # torch, unsloth, unsloth_zoo, xformers, bitsandbytes intentionally omitted -
    # install manually via Unsloth's hardware-aware installer (unsloth.ai/get-started)
    # BEFORE running `pip install -e .[train]`.
    "datasets>=3.4.1,<4.4.0",
    "accelerate>=0.34.1",
    "transformers>=4.51.3,<=4.57.6",
    "trl>=0.18.2,<=0.24.0",
    "peft>=0.18.0",
]

bot = [
    "discord.py>=2.4.0",
]